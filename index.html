<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in & Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  </head>
  <body class="h-full flex items-center justify-center relative overflow-hidden">

    <!-- Background Particles -->
    <div id="particles-js" class="absolute inset-0"></div>

    <!-- Card -->
    <div class="relative bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-sm text-center z-10">
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <img
          src="https://raw.githubusercontent.com/jrlgaa/Logo/Logo/Logo-removebg-preview.png"
          alt="School Logo"
          class="h-24 w-auto sm:h-28"
        />
      </div>

      <!-- Title -->
      <h2 id="form-title" class="font-bold text-white mb-2"
          style="font-size: clamp(1rem, 1vw + 1rem, 1rem);">
        Learning Management System
      </h2>
      <p id="form-subtitle" class="text-gray-400 text-sm">Log in to your account</p>

      <!-- Login Form -->
      <form id="login-form" class="mt-8 space-y-4 text-left">
        <!-- Email -->
        <div>
          <input type="email" placeholder="Email address"
            class="w-full rounded-md border border-gray-600 bg-gray-100 px-3 py-2 text-sm text-gray-900 
                   placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            required />
        </div>
        <!-- Password -->
        <div>
          <input type="password" placeholder="Password"
            class="w-full rounded-md border border-gray-600 bg-gray-100 px-3 py-2 text-sm text-gray-900 
                   placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            required />
        </div>
        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-300">
            <input type="checkbox"
              class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
            Remember me
          </label>
          <a href="#" class="text-blue-400 hover:text-blue-300 font-medium">Forgot password?</a>
        </div>
        <!-- Button -->
        <button type="submit"
          class="w-full rounded-md bg-blue-600 py-2 text-sm font-semibold text-white 
                 hover:bg-blue-500 transition duration-200 
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          Sign in
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="hidden mt-8 space-y-4 text-left">
        <!-- Full Name -->
        <div>
          <input type="text" placeholder="Full Name"
            class="w-full rounded-md border border-gray-600 bg-gray-100 px-3 py-2 text-sm text-gray-900 
                   placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            required />
        </div>
        <!-- Email -->
        <div>
          <input type="email" placeholder="Email address"
            class="w-full rounded-md border border-gray-600 bg-gray-100 px-3 py-2 text-sm text-gray-900 
                   placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            required />
        </div>
        <!-- Password -->
        <div>
          <input type="password" placeholder="Password"
            class="w-full rounded-md border border-gray-600 bg-gray-100 px-3 py-2 text-sm text-gray-900 
                   placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            required />
        </div>
        <!-- Confirm Password -->
        <div>
          <input type="password" placeholder="Confirm Password"
            class="w-full rounded-md border border-gray-600 bg-gray-100 px-3 py-2 text-sm text-gray-900 
                   placeholder-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none"
            required />
        </div>
        <!-- Button -->
        <button type="submit"
          class="w-full rounded-md bg-blue-600 py-2 text-sm font-semibold text-white 
                 hover:bg-blue-500 transition duration-200 
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          Sign Up
        </button>
      </form>

      <!-- Toggle -->
      <p id="toggle-text" class="mt-4 text-sm text-gray-400">
        Don’t have an account?
        <a href="#" id="toggle-link" class="text-blue-400 hover:text-blue-300 font-medium">Sign up</a>
      </p>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
  </body>
</html>
